<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lilya Portfolio</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">

  <style>
    /* Page Toggling Logic */
    .page {
      display: none;
    }

    /* Show UX by default */
    .page-ux {
      display: block;
    }

    /* #art targeted: hide UX, show Art */
    #art:target ~ .page-ux {
      display: none;
    }
    #art:target ~ .page-art {
      display: block;
    }

    /* #ux targeted: show UX, hide Art */
    #ux:target ~ .page-ux {
      display: block;
    }
    #ux:target ~ .page-art {
      display: none;
    }

    /* Gallery Grid Styles */
    .image-grid {
      display: grid;
      /* Creates responsive columns that are at least 300px wide */
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 4px; /* Spacing between images */
      padding: 4px;
    }

    .image-grid img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Prevents stretching */
      display: block;
    }
  </style>
</head>

<body>

  <!-- Toggle targets (must come before the pages) -->
  <span id="ux"></span>
  <span id="art"></span>

  <!-- Navigation Bar -->
  <div class="w3-bar w3-light-grey">
    <a class="w3-bar-item w3-margin">Lilya Portfolio</a>
    <a href="#ux"  class="w3-bar-item w3-margin w3-right w3-button">UX</a>
    <a href="#art" class="w3-bar-item w3-margin w3-right w3-button">Art</a>
  </div>

  <!-- UX Page -->
  <div class="page page-ux">
    <div class="image-grid">
      <img src="images/ux1.png" alt="UX Project 1">
      <img src="images/ux2.png" alt="UX Project 2">
      <img src="images/ux3.png" alt="UX Project 3">
      <img src="images/ux4.png" alt="UX Project 4">
      <img src="images/ux6.png" alt="UX Project 6">
      <img src="images/ux7.png" alt="UX Project 7">
      <img src="images/ux8.png" alt="UX Project 8">
      <img src="images/ux9.png" alt="UX Project 9">
    </div>
  </div>

  <!-- Art Page -->
  <div class="page page-art">
    <div class="image-grid">
      <img src="images/art01.png" alt="Art Piece 1">
      <img src="images/art02.jpg" alt="Art Piece 2">
      <img src="images/art03.jpg" alt="Art Piece 3">
      <img src="images/art04.jpg" alt="Art Piece 4">
      <img src="images/art05.png" alt="Art Piece 5">
      <img src="images/art06.png" alt="Art Piece 6">
      <img src="images/art07.jpg" alt="Art Piece 7">
      <img src="images/art08.jpg" alt="Art Piece 8">
      <img src="images/art09.jpg" alt="Art Piece 9">
      <img src="images/art10.jpg" alt="Art Piece 10">
      <img src="images/art11.png" alt="Art Piece 11">
      <img src="images/art12.png" alt="Art Piece 12">
      <img src="images/art13.jpg" alt="Art Piece 13">
      <img src="images/art14.jpg" alt="Art Piece 14">
      <img src="images/art15.jpg" alt="Art Piece 15">
      <img src="images/art16.png" alt="Art Piece 16">
      <img src="images/art17.png" alt="Art Piece 17">
      <img src="images/art18.jpg" alt="Art Piece 18">
      <img src="images/art19.jpg" alt="Art Piece 19">
      <img src="images/art20.jpg" alt="Art Piece 20">
    </div>
  </div>

</body>
</html>
