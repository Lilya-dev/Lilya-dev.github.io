<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lilya Portfolio</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  
  <!-- Favicon Link -->
  <link rel="icon" type="image/png" href="favicon.png">
  
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">

  <style>
    /* Page Toggling Logic */
    .page {
      display: none;
    }

    /* Show Art by default */
    .page-art {
      display: block;
    }

    /* #ux targeted: show UX, hide Art */
    #ux:target ~ .page-ux {
      display: block;
    }
    #ux:target ~ .page-art {
      display: none;
    }

    /* Active Button Styling (No bolding, just background color) */
    #ux:target ~ .w3-bar .btn-ux {
      background-color: #ccc !important;
      color: #000 !important;
    }

    #home:target ~ .w3-bar .btn-art,
    #art:target ~ .w3-bar .btn-art {
      background-color: #ccc !important;
      color: #000 !important;
    }

    /* --- Header Scaling --- */
    .responsive-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      /* Padding is now symmetrical (same on top/bottom as left/right) */
      padding: clamp(16px, 2vw, 32px) !important; 
    }

    .responsive-text {
      font-size: clamp(18px, 1.5vw, 28px) !important;
      margin: 0;
      padding: 0;
    }

    .responsive-button {
      font-size: clamp(16px, 1.5vw, 28px) !important;
      padding: clamp(8px, 1vw, 16px) clamp(16px, 1.5vw, 32px) !important;
    }

    /* Spacing between the Art and UX buttons */
    .header-buttons {
      display: flex;
      gap: clamp(8px, 1vw, 16px);
    }
    /* ----------------------- */

    /* Gallery Grid Styles (For Art Page) */
    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 4px;
      padding: 4px;
    }

    .image-grid img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* UX Page specific styles */
    .ux-block {
      padding: clamp(16px, 2vw, 48px);
      max-width: 1200px; 
      margin: 0 auto;
    }
    
    .ux-image-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      max-width: 800px; 
      margin-left: auto;
      margin-right: auto;
    }

    .ux-image-container {
      width: 50%;
      aspect-ratio: 1 / 1; 
    }

    .ux-image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover; 
      display: block;
    }
  </style>
</head>

<body>

  <!-- Toggle targets -->
  <span id="home"></span>
  <span id="ux"></span>
  <span id="art"></span>

  <!-- Navigation Bar -->
  <div class="w3-bar w3-light-grey responsive-header">
    
    <!-- Brand name (Left) -->
    <a class="responsive-text">Lilya Portfolio</a>
    
    <!-- Buttons (Right, Art then UX) -->
    <div class="header-buttons">
      <!-- Note: href points to #home so Art acts as the default state -->
      <a href="#home" class="w3-button btn-art responsive-button">Art</a>
      <a href="#ux" class="w3-button btn-ux responsive-button">UX</a>
    </div>
    
  </div>

  <!-- UX Page -->
  <div class="page page-ux ux-block">
    
    <!-- Row 1: ux7 & ux2 -->
    <div class="w3-margin-bottom">
      <p>Placeholder text paragraph above ux7 and ux2. Replace this with your actual project description or details.</p>
      <div class="ux-image-row">
        <div class="ux-image-container"><img src="images/ux7.png" alt="UX Project 7"></div>
        <div class="ux-image-container"><img src="images/ux2.png" alt="UX Project 2"></div>
      </div>
    </div>

    <!-- Row 2: ux3 & ux4 -->
    <div class="w3-margin-bottom">
      <div class="ux-image-row">
        <div class="ux-image-container"><img src="images/ux3.png" alt="UX Project 3"></div>
        <div class="ux-image-container"><img src="images/ux4.png" alt="UX Project 4"></div>
      </div>
    </div>

    <!-- Row 3: ux8 & ux9 -->
    <div class="w3-margin-bottom">
      <p>Placeholder text paragraph above ux8 and ux9. Replace this with your actual project description or details.</p>
      <div class="ux-image-row">
        <div class="ux-image-container"><img src="images/ux8.png" alt="UX Project 8"></div>
        <div class="ux-image-container"><img src="images/ux9.png" alt="UX Project 9"></div>
      </div>
    </div>

  </div>

  <!-- Art Page -->
  <div class="page page-art">
    <div class="image-grid">
      <img src="images/art01.png" alt="Art Piece 1">
      <img src="images/art02.jpg" alt="Art Piece 2">
      <img src="images/art03.jpg" alt="Art Piece 3">
      <img src="images/art04.jpg" alt="Art Piece 4">
      <img src="images/art05.png" alt="Art Piece 5">
      <img src="images/art07.jpg" alt="Art Piece 7">
      <img src="images/art08.jpg" alt="Art Piece 8">
      <img src="images/art09.jpg" alt="Art Piece 9">
      <img src="images/art10.jpg" alt="Art Piece 10">
      <img src="images/art11.png" alt="Art Piece 11">
      <img src="images/art12.png" alt="Art Piece 12">
      <img src="images/art13.jpg" alt="Art Piece 13">
      <img src="images/art14.jpg" alt="Art Piece 14">
      <img src="images/art15.jpg" alt="Art Piece 15">
      <img src="images/art16.png" alt="Art Piece 16">
      <img src="images/art17.png" alt="Art Piece 17">
      <img src="images/art18.jpg" alt="Art Piece 18">
      <img src="images/art20.jpg" alt="Art Piece 20">
    </div>
  </div>

</body>
</html>
