<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lilya Portfolio</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lilya Portfolio</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">

  <style>
    /* Hide both pages by default */
    .page {
      display: none;
    }

    /* Show UX by default */
    .page-ux {
      display: block;
    }

    /* When #art is targeted: hide UX, show Art */
    #art:target ~ .page-ux {
      display: none;
    }
    #art:target ~ .page-art {
      display: block;
    }

    /* When #ux is targeted: show UX, hide Art */
    #ux:target ~ .page-ux {
      display: block;
    }
    #ux:target ~ .page-art {
      display: none;
    }
  </style>
</head>

<body>

  <!-- Toggle targets (must come before the pages) -->
  <span id="ux"></span>
  <span id="art"></span>

  <div class="w3-bar w3-light-grey">
    <a class="w3-bar-item w3-margin">Lilya Portfolio</a>
    <a href="#ux"  class="w3-bar-item w3-margin w3-right w3-button">UX</a>
    <a href="#art" class="w3-bar-item w3-margin w3-right w3-button">Art</a>
  </div>

  <!-- UX page -->
  <div class="page page-ux">
    <div class="w3-bar">
      <div class="w3-display-container">
        <img src="ux.png" class="w3-image" alt="UX portfolio">
      </div>
    </div>
  </div>

  <!-- Art page -->
  <div class="page page-art">
    <div class="w3-bar">
      <div class="w3-display-container">
        <img src="portfolio_canvas.png" class="w3-image" alt="Art portfolio">
      </div>
    </div>
  </div>

</body>
</html>
